version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: desire-dimensions-db
    environment:
      POSTGRES_USER: desire_user
      POSTGRES_PASSWORD: desire_password
      POSTGRES_DB: desire_dimensions
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U desire_user']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: desire-dimensions-adminer
    ports:
      - '8081:8080'
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    driver: local
